<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão PCMA</title>

  <style>
    :root{
      --navy:#062451;
      --navy-2:#0a2e63;
      --blue:#1267e8;
      --blue-light:#eef5ff;
      --text:#102044;
      --muted:#65708a;
      --border:#dfe6f0;
      --bg:#f7f9fc;
      --white:#ffffff;
      --shadow:0 3px 14px rgba(20,45,80,.07);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:var(--bg);
    }

    button,input{font:inherit}
    button{cursor:pointer}

    .topbar{
      background:linear-gradient(105deg,#061f48,#082c61);
      color:white;
      padding:22px 30px;
      display:flex;
      align-items:center;
      gap:22px;
      min-height:125px;
    }

    .brand-icon{
      width:72px;
      height:72px;
      border:3px solid #dceaff;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:40px;
      flex:none;
    }

    .brand{
      min-width:260px;
      flex:1;
    }

    .brand-label{
      color:#73b0ff;
      font-weight:700;
      letter-spacing:.05em;
      font-size:14px;
      margin-bottom:5px;
    }

    .exam-name{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .exam-name input{
      width:min(390px,100%);
      color:white;
      background:transparent;
      border:1px solid transparent;
      border-radius:8px;
      padding:4px 8px;
      font-size:32px;
      font-weight:800;
      outline:none;
    }

    .exam-name input:focus{
      border-color:#7fb5ff;
      background:rgba(255,255,255,.07);
    }

    .edit-hint{
      font-size:13px;
      color:#c6d8f3;
      margin-top:4px;
    }

    .top-actions{
      display:flex;
      gap:14px;
      align-items:center;
    }

    .btn{
      border:1px solid var(--border);
      background:white;
      color:var(--text);
      border-radius:10px;
      padding:14px 19px;
      font-weight:700;
      min-height:52px;
    }

    .btn-primary{
      border-color:#1670f5;
      background:#1670f5;
      color:white;
    }

    .btn:hover{filter:brightness(.97)}
    .btn-primary:hover{filter:brightness(1.05)}

    .container{
      max-width:1500px;
      margin:0 auto;
      padding:28px 26px 34px;
    }

    .week-toolbar{
      display:grid;
      grid-template-columns:70px 80px 1fr 70px;
      gap:14px;
      align-items:center;
      margin-bottom:22px;
    }

    .nav-btn{
      height:52px;
      border:1px solid var(--border);
      background:white;
      border-radius:10px;
      color:var(--text);
      font-size:28px;
    }

    .today-btn{
      height:52px;
      border:1px solid var(--border);
      background:white;
      border-radius:10px;
      font-weight:700;
      color:var(--text);
    }

    .week-title{
      text-align:center;
      font-size:27px;
      font-weight:800;
    }

    .calendar{
      background:white;
      border:1px solid var(--border);
      border-radius:13px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .week-grid{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
    }

    .day{
      min-width:0;
      border-right:1px solid var(--border);
      min-height:600px;
      background:white;
    }

    .day:last-child{border-right:none}

    .day-header{
      background:linear-gradient(180deg,#082d62,#062451);
      color:white;
      text-align:center;
      padding:14px 6px 13px;
      min-height:76px;
    }

    .day-name{
      font-size:16px;
      font-weight:800;
    }

    .day-date{
      font-size:14px;
      margin-top:6px;
      opacity:.92;
    }

    .day-body{
      padding:16px 10px 18px;
    }

    .add-day{
      width:100%;
      border:1px dashed #a9c9fa;
      background:#fff;
      color:#0760dc;
      border-radius:9px;
      padding:12px 7px;
      margin-bottom:16px;
      font-size:14px;
      font-weight:700;
    }

    .add-day:hover{background:#f4f8ff}

    .subject-card{
      position:relative;
      border:1px solid #e4e9f1;
      border-left:3px solid var(--accent,#1267e8);
      border-radius:9px;
      padding:14px 10px 11px;
      margin-bottom:14px;
      box-shadow:0 2px 8px rgba(20,45,80,.06);
      background:white;
    }

    .subject-title{
      display:flex;
      align-items:flex-start;
      gap:9px;
      font-weight:750;
      font-size:15px;
      line-height:1.35;
      min-height:42px;
    }

    .subject-icon{
      color:var(--accent,#1267e8);
      font-size:20px;
      width:20px;
      text-align:center;
      flex:none;
    }

    .subject-actions{
      display:flex;
      gap:6px;
      margin-top:11px;
    }

    .resolve{
      flex:1;
      border:none;
      border-radius:8px;
      padding:9px 7px;
      background:color-mix(in srgb, var(--accent,#1267e8) 8%, white);
      color:var(--accent,#1267e8);
      font-size:13px;
      font-weight:750;
    }

    .resolve:hover{
      background:color-mix(in srgb, var(--accent,#1267e8) 15%, white);
    }

    .remove{
      width:36px;
      border:1px solid #e5e8ee;
      background:white;
      border-radius:8px;
      color:#7a8497;
    }

    .rest{
      min-height:500px;
      display:grid;
      place-items:center;
      text-align:center;
      color:#2366d2;
      padding:25px 12px;
    }

    .rest .cup{font-size:48px}
    .rest strong{display:block;font-size:17px;margin:10px 0 7px}
    .rest span{color:#68758c;font-size:14px}

    .footer{
      margin-top:28px;
      background:white;
      border:1px solid var(--border);
      border-radius:13px;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:var(--shadow);
    }

    .footer-item{
      padding:25px 38px;
      display:flex;
      gap:18px;
      align-items:center;
    }

    .footer-item + .footer-item{border-left:1px solid var(--border)}
    .footer-icon{font-size:34px}
    .footer-title{font-size:17px;font-weight:800;color:#0862df}
    .footer-text{margin-top:5px;color:#68758c;font-size:14px}

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(4,20,45,.48);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
    }

    .modal-backdrop.open{display:flex}

    .modal{
      width:min(520px,100%);
      max-height:90vh;
      overflow:auto;
      background:white;
      border-radius:15px;
      padding:24px;
      box-shadow:0 20px 70px rgba(0,0,0,.25);
    }

    .modal h2{margin:0 0 6px}
    .modal p{color:var(--muted);margin-top:0}

    .form-row{margin:14px 0}
    .form-row label{
      display:block;
      font-size:13px;
      font-weight:750;
      margin-bottom:6px;
    }

    .form-row input,.form-row select{
      width:100%;
      padding:11px 12px;
      border:1px solid #ccd5e3;
      border-radius:9px;
      outline:none;
      background:white;
    }

    .form-row input:focus,.form-row select:focus{
      border-color:#397fe8;
      box-shadow:0 0 0 3px #eaf2ff;
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:9px;
      margin-top:18px;
    }

    .empty{
      color:#8490a3;
      text-align:center;
      padding:18px 5px;
      font-size:13px;
    }

    @media(max-width:1050px){
      .topbar{flex-wrap:wrap}
      .brand{order:2}
      .top-actions{order:3;width:100%}
      .week-grid{overflow-x:auto}
      .day{min-width:210px}
      .week-grid{grid-template-columns:repeat(7,210px)}
      .calendar{overflow-x:auto}
    }

    @media(max-width:700px){
      .topbar{padding:18px 16px}
      .brand-icon{width:56px;height:56px;font-size:30px}
      .exam-name input{font-size:25px}
      .top-actions{flex-wrap:wrap}
      .container{padding:18px 12px}
      .week-toolbar{grid-template-columns:48px 70px 1fr 48px}
      .week-title{font-size:18px}
      .footer{grid-template-columns:1fr}
      .footer-item + .footer-item{border-left:none;border-top:1px solid var(--border)}
      .footer-item{padding:20px}
    }
  </style>
</head>

<body>

  <!-- ============================================================
       CONFIGURAÇÃO DO PAINEL
       EDITE ESTA ÁREA QUANDO QUISER ALTERAR O PAINEL NO GITHUB.
       ============================================================ -->
  <script>
    const CONFIG = {
      nomeDaProva: "Revisão PCMA",

      // Altere os nomes e links abaixo.
      // Para deixar um link ativo, coloque a URL no campo "url".
      materias: [
        { id:"constitucional", nome:"Direito Constitucional", icone:"⚖", cor:"#6d28d9", url:"" },
        { id:"portugues", nome:"Língua Portuguesa", icone:"✎", cor:"#1267e8", url:"" },
        { id:"raciocinio", nome:"Raciocínio Lógico", icone:"▣", cor:"#16a34a", url:"" },
        { id:"informatica", nome:"Informática", icone:"▱", cor:"#f4511e", url:"" },
        { id:"administracao", nome:"Administração Pública", icone:"▥", cor:"#0796a8", url:"" },
        { id:"administrativo", nome:"Direito Administrativo", icone:"▤", cor:"#dc2626", url:"" },
        { id:"orcamento", nome:"Orçamento Público", icone:"$", cor:"#1267e8", url:"" },
        { id:"civil", nome:"Direito Civil", icone:"♙", cor:"#16a34a", url:"" },
        { id:"legislacao", nome:"Legislação Especial", icone:"⚒", cor:"#7c2d12", url:"" },
        { id:"tributario", nome:"Direito Tributário", icone:"▥", cor:"#6d28d9", url:"" },
        { id:"contabilidade", nome:"Contabilidade Geral", icone:"▥", cor:"#ec2387", url:"" },
        { id:"internacional", nome:"Direito Internacional", icone:"◎", cor:"#1267e8", url:"" },
        { id:"redacao", nome:"Redação Oficial", icone:"✎", cor:"#f59e0b", url:"" }
      ],

      // ID das matérias em cada dia.
      // 0 = domingo, 1 = segunda, ... 6 = sábado.
      // Se quiser retirar uma matéria, apague o ID correspondente.
      agenda: {
        1:["constitucional","portugues","raciocinio"],
        2:["informatica","administracao"],
        3:["administrativo","orcamento"],
        4:["civil","legislacao"],
        5:["tributario","contabilidade"],
        6:["internacional","redacao"],
        0:[]
      }
    };
  </script>

  <header class="topbar">
    <div class="brand-icon">🎯</div>

    <div class="brand">
      <div class="brand-label">NOME DA PROVA</div>
      <div class="exam-name">
        <input id="examNameInput" value="" aria-label="Nome da prova">
        <span style="font-size:27px">✎</span>
      </div>
      <div class="edit-hint">Clique no campo para editar o nome da prova</div>
    </div>

    <div class="top-actions">
      <button class="btn" id="manageBtn">📁 Gerenciar Matérias</button>
      <button class="btn btn-primary" id="addBtn">＋ Adicionar Matéria</button>
    </div>
  </header>

  <main class="container">
    <div class="week-toolbar">
      <button class="nav-btn" id="prevWeek" title="Semana anterior">←</button>
      <button class="today-btn" id="todayBtn">Hoje</button>
      <div class="week-title" id="weekTitle"></div>
      <button class="nav-btn" id="nextWeek" title="Próxima semana">→</button>
    </div>

    <section class="calendar">
      <div class="week-grid" id="weekGrid"></div>
    </section>

    <section class="footer">
      <div class="footer-item">
        <div class="footer-icon">💡</div>
        <div>
          <div class="footer-title">Dica da Semana</div>
          <div class="footer-text">Mantenha o foco, siga o planejamento e confie no seu processo.</div>
        </div>
      </div>
      <div class="footer-item">
        <div class="footer-icon">🎯</div>
        <div>
          <div class="footer-title">Meta diária</div>
          <div class="footer-text">Faça o seu melhor todos os dias!</div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h2 id="modalTitle">Adicionar matéria</h2>
      <p>Escolha a matéria e o dia em que ela deverá aparecer.</p>

      <div class="form-row">
        <label for="subjectSelect">Matéria</label>
        <select id="subjectSelect"></select>
      </div>

      <div class="form-row">
        <label for="daySelect">Dia</label>
        <select id="daySelect">
          <option value="1">Segunda-feira</option>
          <option value="2">Terça-feira</option>
          <option value="3">Quarta-feira</option>
          <option value="4">Quinta-feira</option>
          <option value="5">Sexta-feira</option>
          <option value="6">Sábado</option>
          <option value="0">Domingo</option>
        </select>
      </div>

      <div class="form-row">
        <label for="urlInput">Link para resolver questões (opcional)</label>
        <input id="urlInput" type="url" placeholder="https://...">
      </div>

      <div class="modal-actions">
        <button class="btn" id="cancelModal">Cancelar</button>
        <button class="btn btn-primary" id="saveModal">Adicionar</button>
      </div>
    </div>
  </div>

  <script>
    const dayNames = ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
    let currentMonday = getMonday(new Date());

    const examNameInput = document.getElementById("examNameInput");
    const weekTitle = document.getElementById("weekTitle");
    const weekGrid = document.getElementById("weekGrid");
    const modal = document.getElementById("modal");
    const subjectSelect = document.getElementById("subjectSelect");
    const daySelect = document.getElementById("daySelect");
    const urlInput = document.getElementById("urlInput");

    examNameInput.value = CONFIG.nomeDaProva;

    function getMonday(date){
      const d = new Date(date);
      d.setHours(0,0,0,0);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d;
    }

    function formatDate(date){
      return new Intl.DateTimeFormat("pt-BR",{
        day:"2-digit",month:"2-digit"
      }).format(date);
    }

    function formatLongDate(date){
      return new Intl.DateTimeFormat("pt-BR",{
        day:"2-digit",month:"long",year:"numeric"
      }).format(date);
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function subjectById(id){
      return CONFIG.materias.find(m => m.id === id);
    }

    function renderWeek(){
      const sunday = new Date(currentMonday);
      sunday.setDate(sunday.getDate()+6);

      weekTitle.textContent =
        `Semana de ${formatLongDate(currentMonday)} a ${formatLongDate(sunday)}`;

      weekGrid.innerHTML = "";

      for(let column=0; column<7; column++){
        const dayNumber = column === 6 ? 0 : column + 1;
        const date = new Date(currentMonday);
        date.setDate(date.getDate()+column);

        const day = document.createElement("div");
        day.className = "day";

        const subjects = CONFIG.agenda[dayNumber] || [];

        day.innerHTML = `
          <div class="day-header">
            <div class="day-name">${dayNames[dayNumber]}</div>
            <div class="day-date">${formatDate(date)}</div>
          </div>
          <div class="day-body">
            <button class="add-day" data-day="${dayNumber}">＋ Adicionar matéria</button>
            <div class="subject-list">
              ${
                dayNumber === 0
                ? `<div class="rest">
                    <div>
                      <div class="cup">☕</div>
                      <strong>Dia de descanso</strong>
                      <span>Recarregue as energias!</span>
                    </div>
                  </div>`
                : subjects.length
                  ? subjects.map(id => renderSubject(id,dayNumber)).join("")
                  : `<div class="empty">Nenhuma matéria programada.</div>`
              }
            </div>
          </div>
        `;

        weekGrid.appendChild(day);
      }

      document.querySelectorAll(".add-day").forEach(btn=>{
        btn.addEventListener("click",()=>{
          openModal(Number(btn.dataset.day));
        });
      });

      document.querySelectorAll(".resolve").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const id = btn.dataset.id;
          const subject = subjectById(id);
          if(subject && subject.url){
            window.open(subject.url,"_blank","noopener");
          }else{
            alert(`O link de "${subject ? subject.nome : "matéria"}" ainda não foi configurado.\\n\\nEdite o campo "url" dessa matéria na área CONFIGURAÇÃO DO PAINEL no index.html.`);
          }
        });
      });

      document.querySelectorAll(".remove").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const id = btn.dataset.id;
          const day = Number(btn.dataset.day);
          CONFIG.agenda[day] = (CONFIG.agenda[day] || []).filter(x=>x!==id);
          renderWeek();
        });
      });
    }

    function renderSubject(id,day){
      const subject = subjectById(id);
      if(!subject) return "";

      return `
        <article class="subject-card" style="--accent:${subject.cor}">
          <div class="subject-title">
            <span class="subject-icon">${escapeHtml(subject.icone)}</span>
            <span>${escapeHtml(subject.nome)}</span>
          </div>
          <div class="subject-actions">
            <button class="resolve" data-id="${escapeHtml(subject.id)}">
              ▶ Resolver questões
            </button>
            <button class="remove" data-id="${escapeHtml(subject.id)}" data-day="${day}" title="Remover deste dia">×</button>
          </div>
        </article>
      `;
    }

    function populateSubjectSelect(){
      subjectSelect.innerHTML = CONFIG.materias
        .map(m=>`<option value="${escapeHtml(m.id)}">${escapeHtml(m.nome)}</option>`)
        .join("");
    }

    function openModal(preferredDay=1){
      populateSubjectSelect();
      daySelect.value = String(preferredDay);
      urlInput.value = "";
      modal.classList.add("open");
    }

    function closeModal(){
      modal.classList.remove("open");
    }

    document.getElementById("saveModal").addEventListener("click",()=>{
      const id = subjectSelect.value;
      const day = Number(daySelect.value);
      const subject = subjectById(id);

      if(!subject) return;

      const link = urlInput.value.trim();
      if(link) subject.url = link;

      if(!CONFIG.agenda[day]) CONFIG.agenda[day] = [];
      if(!CONFIG.agenda[day].includes(id)){
        CONFIG.agenda[day].push(id);
      }

      closeModal();
      renderWeek();
    });

    document.getElementById("cancelModal").addEventListener("click",closeModal);

    modal.addEventListener("click",(e)=>{
      if(e.target === modal) closeModal();
    });

    document.getElementById("addBtn").addEventListener("click",()=>openModal(1));

    document.getElementById("manageBtn").addEventListener("click",()=>{
      alert(
        "Para fazer alterações permanentes para todos os alunos, edite a área CONFIGURAÇÃO DO PAINEL no início do arquivo index.html no GitHub.\\n\\n" +
        "Ali você poderá alterar:\\n" +
        "• nome da prova\\n" +
        "• nomes das matérias\\n" +
        "• links das questões\\n" +
        "• matérias de cada dia"
      );
    });

    document.getElementById("prevWeek").addEventListener("click",()=>{
      currentMonday.setDate(currentMonday.getDate()-7);
      renderWeek();
    });

    document.getElementById("nextWeek").addEventListener("click",()=>{
      currentMonday.setDate(currentMonday.getDate()+7);
      renderWeek();
    });

    document.getElementById("todayBtn").addEventListener("click",()=>{
      currentMonday = getMonday(new Date());
      renderWeek();
    });

    examNameInput.addEventListener("change",()=>{
      CONFIG.nomeDaProva = examNameInput.value.trim() || "Revisão";
      document.title = CONFIG.nomeDaProva;
    });

    renderWeek();
  </script>
</body>
</html>
